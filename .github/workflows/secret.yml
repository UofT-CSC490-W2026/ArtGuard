name: Disaster Recovery - Secret Injection

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        options:
          - dev
          - prod

jobs:
  inject-secrets:
    name: Inject Secrets (${{ inputs.environment }})
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Inject Modal API Key
        env:
          MODAL_KEY: ${{ secrets.MODAL_API_KEY }}
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          echo "Injecting Modal API key for $ENVIRONMENT..."

          SECRET_NAME="artguard-secrets-${ENVIRONMENT}"

          aws secretsmanager put-secret-value \
            --secret-id "$SECRET_NAME" \
            --secret-string "{\"MODAL_API_KEY\": \"$MODAL_KEY\"}" \
            --region us-east-1

          echo "Secret injected into $SECRET_NAME"
