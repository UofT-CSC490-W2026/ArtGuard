name: Frontend Test Coverage

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  frontend-coverage:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/apps/frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: src/apps/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Generate coverage badge
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: tj-actions/coverage-badge-js@v2
        with:
          output: frontend-coverage.svg

      - name: Commit coverage badge
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add frontend-coverage.svg || true
          git diff --staged --quiet || git commit -m "Update frontend coverage badge [skip ci]"
          git push || true

      - name: Post coverage comment on PR
        if: github.event_name == 'pull_request'
        uses: orgoro/coverage@v3.2
        with:
          coverageFile: src/apps/frontend/coverage/lcov.info
          token: ${{ secrets.GITHUB_TOKEN }}
          thresholdAll: 1.0

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage-report
          path: |
            src/apps/frontend/coverage/
            src/apps/frontend/frontend-coverage.svg
