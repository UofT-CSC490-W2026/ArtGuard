name: Frontend tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend-unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/apps/frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: src/apps/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and unit tests with coverage
        run: npm run typecheck && npm run test:coverage

  frontend-e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/apps/frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: pip install -r ../../../requirements.txt
        working-directory: src/apps/frontend

      - name: Start backend with mocked AWS
        env:
          PYTHONPATH: ../../..
          ENVIRONMENT: dev
          AWS_REGION: us-east-1
          AWS_DEFAULT_REGION: us-east-1
          AWS_ACCESS_KEY_ID: testing
          AWS_SECRET_ACCESS_KEY: testing
          JWT_SECRET_KEY: e2e-test-secret-key
          DDB_USERS_TABLE: e2e-users
          DDB_INFERENCES_TABLE: e2e-inferences
          DDB_IMAGES_TABLE: e2e-images
          DDB_PATCHES_TABLE: e2e-patches
          DDB_RUNS_TABLE: e2e-runs
          S3_IMAGES_RAW_BUCKET: e2e-raw
          S3_IMAGES_PROCESSED_BUCKET: e2e-processed
          CORS_ALLOW_ORIGINS: "*"
        run: |
          python ../../../scripts/start_e2e_backend.py &
          echo $! > /tmp/backend.pid
          # Wait for backend to be ready
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/health && break || sleep 1
          done
        working-directory: src/apps/frontend

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: src/apps/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests (mock mode)
        env:
          CI: true
        run: npm run test:e2e -- --grep-invert "Full-stack"

      - name: Run E2E tests (full-stack with real backend)
        env:
          CI: true
          VITE_API_URL: http://127.0.0.1:8000
          E2E_BACKEND_URL: http://127.0.0.1:8000
        run: npm run test:e2e -- --grep "Full-stack"

      - name: Stop backend
        if: always()
        run: kill $(cat /tmp/backend.pid) 2>/dev/null || true
